version: 2
updates:
  # Application dependencies (pnpm is read through the "npm" ecosystem).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore'
      include: scope
    groups:
      # Electron releases security fixes often, so it gets its own PR.
      electron:
        patterns: ['electron', 'electron-builder', 'electron-updater', 'electron-vite']
      # Everything else moves together to keep the noise down.
      minor-and-patch:
        update-types: [minor, patch]
        exclude-patterns: ['electron', 'electron-builder', 'electron-updater', 'electron-vite']

  # The versions of actions used in .github/workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'ci'
    groups:
      actions:
        patterns: ['*']
