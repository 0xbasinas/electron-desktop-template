name: Publish beta pre-release
# Same as the stable publisher, but for the beta branch: published as a pre-release that only
# people on the beta update channel receive.
on:
  push:
    branches: [beta]
    paths:
      - 'src/**'
      - '!src/**/*.test.ts'
      - '!src/**/*.test.tsx'
      - 'build/**'
      - 'resources/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'electron-builder.yml'
      - 'electron.vite.config.ts'

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: publish-beta
  cancel-in-progress: false

jobs:
  ci:
    name: CI gate
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish
    needs: ci
    uses: ./.github/workflows/_publish.yml
    with:
      channel: beta
