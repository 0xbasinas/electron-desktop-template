name: Publish stable release
# Pushes to main that change the app (src, build, package.json and build config) are tested,
# then built for Windows, macOS and Linux and published as a normal release.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '!src/**/*.test.ts'
      - '!src/**/*.test.tsx'
      - 'build/**'
      - 'resources/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'electron-builder.yml'
      - 'electron.vite.config.ts'

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: publish-stable
  cancel-in-progress: false

jobs:
  ci:
    name: CI gate
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish
    needs: ci
    uses: ./.github/workflows/_publish.yml
    with:
      channel: stable
