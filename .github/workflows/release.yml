name: Release
# Every push to main publishes a release. Version = <major>.<minor from package.json>.<commit count>,
# so the first commit is 0.0.1 and it grows by itself. Bump major/minor by editing package.json.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.github/workflows/ci.yml'

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      sha: ${{ steps.v.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        run: |
          base=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          count=$(git rev-list --count HEAD)
          echo "version=$base.$count" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: build:win
          - os: macos-latest
            script: build:mac
          - os: ubuntu-latest
            script: build:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Set version
        run: npm pkg set version=${{ needs.version.outputs.version }}
      - run: pnpm run ${{ matrix.script }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  name-release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - run: >
          gh release edit "v${{ needs.version.outputs.version }}"
          --repo "${{ github.repository }}"
          --title "v${{ needs.version.outputs.version }} (${{ needs.version.outputs.sha }})"
          --notes "Build of commit ${{ needs.version.outputs.sha }}: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
