name: Publish (shared steps)
# Reusable pipeline behind "Publish stable release" and "Publish beta pre-release".
# Not run directly: it is called with channel = stable | beta.
on:
  workflow_call:
    inputs:
      channel:
        description: stable or beta
        type: string
        required: true

permissions:
  contents: write
  id-token: write # build provenance (OIDC)
  attestations: write

jobs:
  version:
    name: Work out the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      sha: ${{ steps.v.outputs.sha }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          base=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          count=$(git rev-list --count HEAD)
          version="$base.$count"
          prerelease=false
          if [ "$CHANNEL" = "beta" ]; then
            version="$version-beta"
            prerelease=true
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      # Tag the exact commit that was pushed, so the release never points at a different branch tip.
      - name: Tag this commit
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists"
          else
            git tag "v$VERSION" "$GITHUB_SHA"
            git push origin "v$VERSION"
          fi

  build:
    name: Build and publish (${{ matrix.os }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: build:win
            artifacts: |
              dist/*.exe
          - os: macos-latest
            script: build:mac
            artifacts: |
              dist/*.dmg
              dist/*.zip
          - os: ubuntu-latest
            script: build:linux
            artifacts: |
              dist/*.AppImage
              dist/*.deb
    runs-on: ${{ matrix.os }}
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Set version
        shell: bash
        run: npm pkg set version=${{ needs.version.outputs.version }}
      - name: Publish as pre-release
        if: needs.version.outputs.prerelease == 'true'
        shell: bash
        run: |
          sed -i.bak 's/releaseType: release/releaseType: prerelease/' electron-builder.yml
      - run: pnpm run ${{ matrix.script }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ matrix.artifacts }}

  finalize:
    name: Release notes and checksums
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git fetch --tags --force
      - name: Title, notes and checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
          SHA: ${{ needs.version.outputs.sha }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          tag="v$VERSION"

          node scripts/release-notes.mjs "$tag" "$CHANNEL" > notes.md
          {
            echo "---"
            echo "Channel: **$CHANNEL**. Built from commit \`$SHA\`."
            echo
            echo "Verify a download: \`sha256sum -c SHA256SUMS.txt --ignore-missing\`, or \`gh attestation verify <file> --repo $GITHUB_REPOSITORY\`."
          } >> notes.md

          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" \
            --title "v$VERSION ($SHA)" \
            --notes-file notes.md

          mkdir assets
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir assets \
            --pattern '*.exe' --pattern '*.dmg' --pattern '*.zip' --pattern '*.AppImage' --pattern '*.deb'
          (cd assets && sha256sum * > ../SHA256SUMS.txt)
          cat SHA256SUMS.txt
          gh release upload "$tag" SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
