name: CI
# Runs on pull requests, and is also called by the publish workflows as a gate before they release.
# Pushes that don't trigger a publish (docs, tests, CI and config changes) get their own run below.
on:
  pull_request:
  workflow_call:
  push:
    branches: [main, beta]
    paths:
      - '.github/**'
      - 'docs/**'
      - 'tests/**'
      - 'scripts/**'
      - '**.md'
      - '**/*.test.ts'
      - '**/*.test.tsx'
      - 'eslint.config.mjs'
      - 'vitest.config.ts'
      - 'playwright.config.ts'
      - 'playwright.update.config.ts'
      - 'commitlint.config.mjs'
      - 'bundle-budget.json'
      - '.prettier*'

permissions:
  contents: read

env:
  HUSKY: 0

jobs:
  check:
    name: Lint, types, tests, bundle size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Commit messages follow Conventional Commits
        if: github.event_name == 'pull_request'
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:bundle

  smoke:
    name: Smoke test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Package the app (unpacked)
        run: pnpm build:unpack
      - name: Launch the packaged app and check the window opens
        if: runner.os != 'Linux'
        run: pnpm test:e2e
      - name: Launch the packaged app and check the window opens (virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm test:e2e

  # Builds an old and a new version, then checks the old one finds, downloads and reports the new one
  # from a local feed. This is what catches packaging and updater mistakes before users do.
  update:
    name: Update test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build old and new versions
        run: node scripts/prepare-update-e2e.mjs
      - name: Old version updates to the new one
        if: runner.os != 'Linux'
        run: pnpm exec playwright test -c playwright.update.config.ts
      - name: Old version updates to the new one (virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm exec playwright test -c playwright.update.config.ts

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Fail on known high-severity vulnerabilities
        run: pnpm audit --audit-level high
