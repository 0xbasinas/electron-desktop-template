name: Dependency audit
# New advisories are published all the time, so this also runs on a schedule, not just on changes.
# The same check runs on every pull request as part of CI.
on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - id: audit
        run: pnpm audit --audit-level high
      - name: Open an issue when it fails
        if: failure() && steps.audit.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --label security --state open --search "Dependency audit in:title" --json number --jq '.[0].number')
          if [ -z "$existing" ]; then
            gh label create security --color d73a4a --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
            gh issue create --repo "$GITHUB_REPOSITORY" --label security \
              --title "Dependency audit found high-severity advisories" \
              --body "The scheduled audit failed: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
